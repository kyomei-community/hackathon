# EXP-007: 脱文脈強化版。EXP-001から住人名を人名→記号（A1〜A6）に置換しただけ。
# 条件4（非模倣性）の実測：命名された仮説の伝播が、人名という人格文脈なしでも出るか
experiment_id: EXP-007_脱文脈強化_seed1
seed: 1
model: claude-sonnet-5
parallel: 3
turns: 30
communication: true
cost_limit_usd: 25.0
llm_workdir: /tmp/sim_agent_home
agents:
  names: [A1, A2, A3, A4, A5, A6]
  init_energy_range: [6, 14]
  base_recovery_range: [1.0, 3.0]
physics:
  action_cost: 4
  bonus_gain: 0.5
  bonus_decay: 1.0
  bonus_max: 5
  energy_max: 20
