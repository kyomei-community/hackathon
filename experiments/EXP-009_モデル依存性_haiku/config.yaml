# EXP-009: モデル依存性プローブ。EXP-001から model のみ Sonnet→Haiku に変更（6体×15ターン）
experiment_id: EXP-009_モデル依存性_haiku
seed: 1
model: claude-haiku-4-5
parallel: 3
turns: 15
communication: true
cost_limit_usd: 10.0
llm_workdir: /tmp/sim_agent_home
agents:
  names: [ハル, ミナ, ケイ, サト, ユキ, リン]
  init_energy_range: [6, 14]
  base_recovery_range: [1.0, 3.0]
physics:
  action_cost: 4
  bonus_gain: 0.5
  bonus_decay: 1.0
  bonus_max: 5
  energy_max: 20
